name: shuijiao_score_discount_top10_2020_2026
description: ""
version: 2
data:
  provider_uri: data/qlib_data_fixed
  universe: all_a
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 120
fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
  change: $change
factors:
  h1: Maximum(high, Ref(close, 1))
  l1: Minimum(low, Ref(close, 1))
  p1: h1 - l1
  resistance: l1 + p1 * 7 / 8
  support: l1 + p1 * 0.5 / 8
  midline: (support + resistance) / 2
  llv_low: Min(low, 55)
  hhv_high: Max(high, 55)
  rsv: (close - llv_low) / (hhv_high - llv_low + 1e-10) * 100
  sma1: SMA_TDX(rsv, 5, 1)
  sma2: SMA_TDX(sma1, 3, 1)
  v11: 3 * sma1 - 2 * sma2
  trend_line: EMA(v11, 3)
signals:
  trend_prev: Ref(trend_line, 1)
  bb1: (trend_prev < 11) and (trend_prev > 6) and Cross(trend_line, 11)
  bb2: (trend_prev < 6) and (trend_prev > 3) and Cross(trend_line, 6)
  bb3: (trend_prev < 3) and (trend_prev > 1) and Cross(trend_line, 3)
  bb4: (trend_prev < 1) and (trend_prev > 0) and Cross(trend_line, 1)
  bb5: (trend_prev < 0) and Cross(trend_line, 0)
  buy_signal: (bb1 or bb2 or bb3 or bb4 or bb5) and (close < midline)
  sell_signal: (trend_line > 89) and Filter(trend_line > 89, 15) and (close > midline)
selector:
  mode: precomputed
  where: buy_signal
  score: midline / close - 1
  sort: score_desc
  topk: 30
  lag: 1
  wrap_first_signal: false
  reason: shuijiao_buy
rebalance:
  type: equal_weight
  max_positions: 10
  cash_use_ratio: 0.99
  buy_only_new_positions: true
execution:
  deal_price: close
  sell_rules:
  - name: signal_sell
    when: sell_signal
    action: sell_all
  - name: take_profit
    when: pnl_pct > 0.20
    action: sell_all
  - name: stop_loss
    when: pnl_pct < -0.10
    action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true
cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0
engine:
  init_cash: 1000000
  validate_trading_rules: false
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false
