name: shuijiao_quality_time32_pos12_topk10_2020_2026_mainboard
description: "Shuijiao quality/time-control variant: keeps the low-level trend_line cross entry, then adds liquidity, daily range, EMA repair and RSI quality filters. It uses fewer positions than the broad shuijiao baseline and exits after about one month if the repair does not pay off."
version: 1

data:
  provider_uri: data/qlib_data_fixed
  universe: all_mainboard
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 160

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
  change: $change

factors:
  h1: Maximum(high, Ref(close, 1))
  l1: Minimum(low, Ref(close, 1))
  p1: h1 - l1
  resistance: l1 + p1 * 7 / 8
  support: l1 + p1 * 0.5 / 8
  midline: (support + resistance) / 2
  llv_low: Min(low, 55)
  hhv_high: Max(high, 55)
  rsv55: (close - llv_low) / (hhv_high - llv_low + 1e-10) * 100
  sma1: SMA_TDX(rsv55, 5, 1)
  sma2: SMA_TDX(sma1, 3, 1)
  v11: 3 * sma1 - 2 * sma2
  trend_line: EMA(v11, 3)
  ema12: EMA(close, 12)
  ema26: EMA(close, 26)
  ema_diff: ema12 - ema26
  ma3: Mean(close, 3)
  ma6: Mean(close, 6)
  ma12: Mean(close, 12)
  ma24: Mean(close, 24)
  bbi: (ma3 + ma6 + ma12 + ma24) / 4
  delta: close - Ref(close, 1)
  gain: Clip(delta, 0, 999999)
  loss: Clip(0 - delta, 0, 999999)
  avg_gain: SMA_TDX(gain, 14, 1)
  avg_loss_raw: SMA_TDX(loss, 14, 1)
  avg_loss: Where(avg_loss_raw == 0, NaN(), avg_loss_raw)
  rs: avg_gain / avg_loss
  rsi14: FillNa(100 - 100 / (1 + rs), 50)
  low9: Min(low, 9)
  high9: Max(high, 9)
  rsv9: (close - low9) / (high9 - low9 + 1e-10) * 100
  kdj_k: EMA(rsv9, 5)
  kdj_d: EMA(kdj_k, 5)
  kdj_j: 3 * kdj_k - 2 * kdj_d
  ret1_abs: Abs(close / (Ref(close, 1) + 1e-10) - 1)
  amplitude: (high - low) / (low + 1e-10)
  turnover_amount: (open + close) / 2 * volume
  turnover43: Mean(turnover_amount, 43)
  liquidity_rank: CSPctRank(turnover43)
  market_health: CSMean(trend_line > 20)
  score: liquidity_rank * 1.20 + trend_line * 0.03 + ema_diff * 8 + (rsi14 - 35) * 0.01 - Abs(kdj_j - 55) * 0.01

signals:
  trend_prev: Ref(trend_line, 1)
  bb1: (trend_prev < 11) and (trend_prev > 6) and Cross(trend_line, 11)
  bb2: (trend_prev < 6) and (trend_prev > 3) and Cross(trend_line, 6)
  bb3: (trend_prev < 3) and (trend_prev > 1) and Cross(trend_line, 3)
  bb4: (trend_prev < 1) and (trend_prev > 0) and Cross(trend_line, 1)
  bb5: (trend_prev < 0) and Cross(trend_line, 0)
  base_buy: (bb1 or bb2 or bb3 or bb4 or bb5) and (close < midline)
  day_ok: (ret1_abs < 0.045) and (amplitude < 0.095)
  liquidity_ok: liquidity_rank > 0.35
  repair_ok: (close > Ref(close, 1)) and (ema_diff > Ref(ema_diff, 1))
  rsi_ok: (rsi14 >= 35) and (rsi14 <= 78)
  buy_signal: base_buy and day_ok and liquidity_ok and repair_ok and rsi_ok
  sell_signal: (trend_line > 89) and Filter(trend_line > 89, 15) and (close > midline)

selector:
  mode: precomputed
  where: buy_signal
  score: score
  sort: score_desc
  topk: 10
  lag: 1
  wrap_first_signal: false
  reason: shuijiao_quality_time32_buy

rebalance:
  type: equal_weight
  max_positions: 12
  max_positions_rules:
    - when: market_health < 0.14
      value: 5
    - when: market_health < 0.22
      value: 8
  cash_use_ratio: 0.98
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: signal_sell
      when: sell_signal
      action: sell_all
    - name: take_profit_21pct
      when: pnl_pct > 0.21
      action: sell_all
    - name: stop_loss_89permil
      when: pnl_pct < -0.089
      action: sell_all
    - name: time_stop_32d
      when: holding_days > 32
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true

cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0

engine:
  init_cash: 1000000
  validate_trading_rules: true
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false
