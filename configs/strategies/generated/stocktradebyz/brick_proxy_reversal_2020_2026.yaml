name: stocktradebyz_brick_proxy_reversal_2020_2026
description: ""
version: 1

data:
  provider_uri: data/qlib_data_fixed
  universe: all_a
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 260

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
  change: $change

factors:
  zxdq_1: EMA(close, 10)
  zxdq: EMA(zxdq_1, 10)
  ma14: Mean(close, 14)
  ma28: Mean(close, 28)
  ma57: Mean(close, 57)
  ma114: Mean(close, 114)
  zxdkx: (ma14 + ma28 + ma57 + ma114) / 4
  ma50: Mean(close, 50)
  ma100: Mean(close, 100)
  ma150: Mean(close, 150)
  ret1: close / Ref(close, 1) - 1
  ret3: close / Ref(close, 3) - 1
  ret10: close / Ref(close, 10) - 1
  vol_ma20: Mean(volume, 20)
  vol_ratio: volume / (vol_ma20 + 1e-10)
  turnover_amount: (open + close) / 2 * volume
  turnover43: Mean(turnover_amount, 43)
  liquidity_rank: CSPctRank(turnover43)
  score_brick_proxy: ret1 + vol_ratio * 0.05 + liquidity_rank * 0.05

signals:
  prior_green_proxy: (Ref(close, 1) < Ref(open, 1)) and (Ref(close, 2) < Ref(open, 2))
  red_reversal_proxy: (close > open) and (ret1 > 0.02) and (ret1 < 0.18) and (ret3 < 0.03)
  zx_filter: (zxdq > zxdkx) and (close < zxdq * 1.47) and (ma50 > ma100) and (ma100 > ma150)
  buy_signal: prior_green_proxy and red_reversal_proxy and zx_filter and (vol_ratio > 1.15) and (liquidity_rank > 0.25)
  sell_signal: (close < ma28) or (ret10 < -0.10)

selector:
  mode: precomputed
  where: buy_signal
  score: score_brick_proxy
  sort: score_desc
  topk: 40
  lag: 1
  wrap_first_signal: false
  reason: stocktradebyz_brick_proxy_buy

rebalance:
  type: equal_weight
  max_positions: 10
  cash_use_ratio: 0.99
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: signal_sell
      when: sell_signal
      action: sell_all
    - name: take_profit
      when: pnl_pct > 0.28
      action: sell_all
    - name: stop_loss
      when: pnl_pct < -0.09
      action: sell_all
    - name: time_stop
      when: holding_days > 20
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true

cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0

engine:
  init_cash: 1000000
  validate_trading_rules: false
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false
