name: trend_pullback_resume_2020_2026
description: ""
version: 1

data:
  provider_uri: data/qlib_data_fixed
  universe: all_a
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 260

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
  change: $change

factors:
  ma10: Mean(close, 10)
  ma20: Mean(close, 20)
  ma60: Mean(close, 60)
  ma120: Mean(close, 120)
  ret20: close / Ref(close, 20) - 1
  ret60: close / Ref(close, 60) - 1
  pullback_depth: ma20 / close - 1
  rank_ret60: CSPctRank(ret60)
  score_pullback: ret60 + pullback_depth * 0.5

signals:
  resume_cross: Cross(close, ma10)
  buy_signal: (ma20 > ma60) and (ma60 > ma120) and (ret60 > 0.15) and (rank_ret60 > 0.85) and (Ref(close, 1) < Ref(ma10, 1)) and resume_cross
  sell_signal: (close < ma20) or (ret20 < -0.10)

selector:
  mode: precomputed
  where: buy_signal
  score: score_pullback
  sort: score_desc
  topk: 30
  lag: 1
  wrap_first_signal: false
  reason: trend_pullback_resume_buy

rebalance:
  type: equal_weight
  max_positions: 10
  cash_use_ratio: 0.99
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: signal_sell
      when: sell_signal
      action: sell_all
    - name: take_profit
      when: pnl_pct > 0.30
      action: sell_all
    - name: stop_loss
      when: pnl_pct < -0.10
      action: sell_all
    - name: time_stop
      when: holding_days > 25
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true

cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0

engine:
  init_cash: 1000000
  validate_trading_rules: false
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false

