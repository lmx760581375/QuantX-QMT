name: etf_momentum_quality_top1_2016_2026
title: ETF 动量质量轮动 Top1
description: ETF 轮动 Top1 对照版；更接近 JoinQuant 单 ETF 轮动思路，用同一批连续化 ETF 数据验证集中持有的收益/回撤特征。
version: 1

data:
  provider_uri: data/qlib_etf_data
  universe: [SH510300, SH510500, SH512100, SZ159915, SH588080, SH510880, SH512890, SH512800, SH512880, SH512480, SZ159995, SH515050, SH512660, SH512010, SH512170, SH515790, SZ159928, SH512400, SH515220, SH518880, SH511380, SH511880, SH513100, SH513500, SH513030]
  start: 2016-01-04
  end: latest
  look_back_days: 260

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
  change: $change

factors:
  ma20: Mean(close, 20)
  ma60: Mean(close, 60)
  ma120: Mean(close, 120)
  ret1: close / (Ref(close, 1) + 1e-10) - 1
  ret20: close / (Ref(close, 20) + 1e-10) - 1
  ret60: close / (Ref(close, 60) + 1e-10) - 1
  ret120: close / (Ref(close, 120) + 1e-10) - 1
  abs_ret1: Abs(ret1)
  vol20_proxy: Mean(abs_ret1, 20)
  vol60_proxy: Mean(abs_ret1, 60)
  vol_ma5: Mean(volume, 5)
  volume_ratio5: volume / (vol_ma5 + 1e-10)
  high60: Max(close, 60)
  high120: Max(close, 120)
  drawdown60: close / (high60 + 1e-10) - 1
  drawdown120: close / (high120 + 1e-10) - 1
  dist_ma60: close / (ma60 + 1e-10) - 1
  market_ret20: CSMean(ret20)
  market_trend20: CSMean(close > ma20)
  ret20_rank: CSPctRank(ret20)
  ret60_rank: CSPctRank(ret60)
  ret120_rank: CSPctRank(ret120)
  low_vol_rank: 1 - CSPctRank(vol60_proxy)
  dd_rank: CSPctRank(drawdown120)
  trend_rank: CSPctRank(dist_ma60)
  score: ret20_rank * 0.30 + ret60_rank * 0.36 + ret120_rank * 0.18 + low_vol_rank * 0.10 + dd_rank * 0.10 + trend_rank * 0.08

signals:
  loss3_ok: (ret1 > -0.03) and (Ref(ret1, 1) > -0.03) and (Ref(ret1, 2) > -0.03)
  volume_ok: volume_ratio5 < 2.20
  trend_ok: (close > ma20) and (ma20 > ma60)
  momentum_ok: (ret20 > 0.00) and (ret60 > 0.015) and (ret120 > -0.03)
  risk_ok: (drawdown60 > -0.12) and (drawdown120 > -0.20) and (vol20_proxy < 0.045)
  market_ok: (market_trend20 >= 0.28) or (market_ret20 > 0.005)
  buy_signal: market_ok and trend_ok and momentum_ok and risk_ok and loss3_ok and volume_ok

selector:
  mode: precomputed
  where: buy_signal
  score: score
  sort: score_desc
  topk: 1
  lag: 1
  wrap_first_signal: false
  reason: etf_momentum_quality_top1_buy

rebalance:
  type: equal_weight
  max_positions: 1
  cash_use_ratio: 0.98
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: trend_break_ma20
      when: close < ma20
      action: sell_all
    - name: drawdown60_stop_14pct
      when: drawdown60 < -0.14
      action: sell_all
    - name: ret20_weak_stop
      when: ret20 < -0.04
      action: sell_all
    - name: time_review_45d
      when: holding_days > 45 and close < ma20
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: false
    reuse_sell_cash: true

cost:
  commission_rate: 0.0001
  min_commission: 5.0
  stamp_tax_rate: 0.0
  stamp_tax_on_buy: false
  transfer_fee_rate: 0.0
  slippage: 0.0002

engine:
  init_cash: 1000000
  validate_trading_rules: true
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: false
  auto_adjust_buy_quantity: true
