name: active_value_brick_ml_consensus_stop6_2025_2026
version: 2026-07-15
description: >
  Research reproduction candidate for active-value proxy + brick reversal.
  Uses audited walk-forward ml_consensus scores and a 6% stop-loss / 10-day
  maximum holding exit. Sell rules are evaluated from the prior session close
  and executed at the next session open, matching the audited replay stop-loss
  timing.
data:
  provider_uri: data/qlib_data_fixed
  universe: external_score
  start: '2025-01-02'
  end: '2026-07-15'
  look_back_days: 720
fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
selector:
  mode: external_score
  path: data/derived/active_value_brick_ml/ml_consensus_scores_2025_2026.parquet
  date_col: date
  instrument_col: instrument
  score_col: ml_consensus_score
  lag: 1
  sort: score_desc
  topk: 3
  candidate_limit: 20
  reason: active_value_brick_ml_consensus
rebalance:
  type: equal_weight
  max_positions: 3
  buy_only_new_positions: true
execution:
  deal_price: open
  sell_decision_price: close
  cash_use_ratio: 0.98
  sell_rules:
  - name: stop_loss_6pct
    when: pnl_pct < -0.06
    action: sell_all
  - name: max_hold_10d
    when: holding_days >= 10
    action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true
cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0005
  stamp_tax_on_buy: false
  transfer_fee_rate: 0.0
  slippage: 0.0
  buy_slippage: 0.003
  sell_slippage: 0.001
engine:
  init_cash: 1000000
  validate_trading_rules: true
  deal_price: open
  max_workers: 1
  legacy_cost_price: false
  auto_adjust_buy_quantity: true
  precompute_signals: false
