name: trend_relative_strength_2020_2026_mainboard
description: ""
version: 1

data:
  provider_uri: data/qlib_data_fixed
  universe: all_mainboard
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 260

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  change: $change

factors:
  ma20: Mean(close, 20)
  ma60: Mean(close, 60)
  ma120: Mean(close, 120)
  ret5: close / (Ref(close, 5) + 1e-10) - 1
  ret20: close / (Ref(close, 20) + 1e-10) - 1
  ret60: close / (Ref(close, 60) + 1e-10) - 1
  ret120: close / (Ref(close, 120) + 1e-10) - 1
  amp20: Mean((high - low) / (low + 1e-10), 20)
  turnover_amount: (open + close) / 2 * volume
  turnover43: Mean(turnover_amount, 43)
  liquidity_rank: CSPctRank(turnover43)
  rs_score: CSPctRank(ret20) + CSPctRank(ret60) + CSPctRank(ret120)
  score: rs_score + liquidity_rank * 0.25 - CSPctRank(amp20) * 0.25

signals:
  trend_ok: (close > ma20) and (ma20 > ma60) and (ma60 > ma120)
  strength_ok: (rs_score > 2.35) and (ret20 > 0.05) and (ret60 > 0.10)
  buy_signal: trend_ok and strength_ok and (liquidity_rank > 0.20)
  sell_signal: (close < ma20) or (ret20 < -0.07)

selector:
  mode: precomputed
  where: buy_signal
  score: score
  sort: score_desc
  topk: 3
  lag: 1
  wrap_first_signal: false
  reason: trend_relative_strength_buy

rebalance:
  type: equal_weight
  max_positions: 3
  cash_use_ratio: 0.98
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: signal_sell
      when: sell_signal
      action: sell_all
    - name: take_profit_21pct
      when: pnl_pct > 0.21
      action: sell_all
    - name: stop_loss_9pct
      when: pnl_pct < -0.09
      action: sell_all
    - name: time_stop_25d
      when: holding_days > 25
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true

cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0

engine:
  init_cash: 1000000
  validate_trading_rules: true
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false
