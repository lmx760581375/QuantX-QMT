name: trend_donchian_momentum_2020_2026_mainboard
description: ""
version: 1

data:
  provider_uri: data/qlib_data_fixed
  universe: all_mainboard
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 260

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  change: $change

factors:
  ma20: Mean(close, 20)
  ma60: Mean(close, 60)
  ma120: Mean(close, 120)
  high60_prev: Max(Ref(high, 1), 60)
  ret1_abs: Abs(close / (Ref(close, 1) + 1e-10) - 1)
  ret20: close / (Ref(close, 20) + 1e-10) - 1
  ret60: close / (Ref(close, 60) + 1e-10) - 1
  amp20: Mean((high - low) / (low + 1e-10), 20)
  turnover_amount: (open + close) / 2 * volume
  turnover20: Mean(turnover_amount, 20)
  liquidity_rank: CSPctRank(turnover20)
  momentum_rank: CSPctRank(ret60) + CSPctRank(ret20)
  risk_rank: CSPctRank(amp20)
  score: momentum_rank + liquidity_rank * 0.3 - risk_rank * 0.3

signals:
  trend_ok: (close > ma60) and (ma60 > ma120)
  breakout_ok: close > high60_prev
  day_ok: ret1_abs < 0.065
  buy_signal: trend_ok and breakout_ok and day_ok and (liquidity_rank > 0.20)
  sell_signal: (close < ma20) or (ret20 < -0.08)

selector:
  mode: precomputed
  where: buy_signal
  score: score
  sort: score_desc
  topk: 5
  lag: 1
  wrap_first_signal: false
  reason: trend_donchian_momentum_buy

rebalance:
  type: equal_weight
  max_positions: 5
  cash_use_ratio: 0.98
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: signal_sell
      when: sell_signal
      action: sell_all
    - name: take_profit_24pct
      when: pnl_pct > 0.24
      action: sell_all
    - name: stop_loss_10pct
      when: pnl_pct < -0.10
      action: sell_all
    - name: time_stop_35d
      when: holding_days > 35
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true

cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0

engine:
  init_cash: 1000000
  validate_trading_rules: true
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false
