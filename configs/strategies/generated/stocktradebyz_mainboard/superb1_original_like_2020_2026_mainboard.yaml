name: stocktradebyz_superb1_original_like_2020_2026_mainboard
description: ""
version: 1

data:
  provider_uri: data/qlib_data_fixed
  universe: all_mainboard
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 320

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
  change: $change

factors:
  ma3: Mean(close, 3)
  ma6: Mean(close, 6)
  ma12: Mean(close, 12)
  ma24: Mean(close, 24)
  bbi: (ma3 + ma6 + ma12 + ma24) / 4
  bbi_trend_ok: BBIUptrend(bbi, 20, 120, 0.30)
  close_range120: Max(close, 120) / (Min(close, 120) + 1e-10) - 1
  j: KDJJ(high, low, close, 9)
  j_q120: RollingQuantile(j, 120, 0.10)
  ma60: Mean(close, 60)
  ma60_cross120: Sum(Cross(close, ma60), 120)
  ema12: EMA(close, 12)
  ema26: EMA(close, 26)
  dif: ema12 - ema26
  zxdq_1: EMA(close, 10)
  zxdq: EMA(zxdq_1, 10)
  ma14: Mean(close, 14)
  ma28: Mean(close, 28)
  ma57: Mean(close, 57)
  ma114: Mean(close, 114)
  zxdkx: (ma14 + ma28 + ma57 + ma114) / 4
  ret1_abs: Abs(close / (Ref(close, 1) + 1e-10) - 1)
  amplitude: (high - low) / (low + 1e-10)
  b1_core: (ret1_abs < 0.02) and (amplitude < 0.07) and (close_range120 <= 1.0) and bbi_trend_ok and ((j < 15) or (j <= j_q120)) and (close > ma60) and (ma60_cross120 > 0) and (dif > 0) and (close > zxdkx) and (zxdq > zxdkx)
  stable_after_b1: RecentStableSignal(b1_core, close, 10, 0.02, 3)
  drop_today: (Ref(close, 1) - close) / (Ref(close, 1) + 1e-10)
  j_q10: RollingQuantile(j, 10, 0.10)
  turnover_amount: (open + close) / 2 * volume
  turnover43: Mean(turnover_amount, 43)
  liquidity_rank: CSPctRank(turnover43)
  score: liquidity_rank + drop_today * 2 + (10 - j) * 0.03

signals:
  j_extreme: (j < 10) or (j <= j_q10)
  buy_signal: stable_after_b1 and (drop_today >= 0.02) and j_extreme and (zxdq > zxdkx)
  sell_signal: not buy_signal

selector:
  mode: precomputed
  where: buy_signal
  score: score
  sort: score_desc
  topk: 3
  lag: 1
  wrap_first_signal: false
  reason: superb1_original_like_buy

rebalance:
  type: equal_weight
  max_positions: 3
  cash_use_ratio: 0.98
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: not_selected
      when: sell_signal
      action: sell_all
    - name: take_profit_5pct
      when: pnl_pct > 0.05
      action: sell_all
    - name: stop_loss_2pct
      when: pnl_pct < -0.02
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true

cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0

engine:
  init_cash: 1000000
  validate_trading_rules: false
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false
