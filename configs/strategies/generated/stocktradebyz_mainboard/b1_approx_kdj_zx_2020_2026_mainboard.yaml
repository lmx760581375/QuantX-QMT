name: stocktradebyz_b1_approx_kdj_zx_2020_2026_mainboard
description: ""
version: 1

data:
  provider_uri: data/qlib_data_fixed
  universe: all_mainboard
  start: 2020-01-02
  end: 2026-05-31
  look_back_days: 260

fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
  change: $change

factors:
  llv9: Min(low, 9)
  hhv9: Max(high, 9)
  rsv: (close - llv9) / (hhv9 - llv9 + 1e-10) * 100
  k: SMA_TDX(rsv, 3, 1)
  d: SMA_TDX(k, 3, 1)
  j: 3 * k - 2 * d
  zxdq_1: EMA(close, 10)
  zxdq: EMA(zxdq_1, 10)
  ma14: Mean(close, 14)
  ma28: Mean(close, 28)
  ma57: Mean(close, 57)
  ma114: Mean(close, 114)
  zxdkx: (ma14 + ma28 + ma57 + ma114) / 4
  wma50_proxy: Mean(close, 50)
  wma100_proxy: Mean(close, 100)
  wma150_proxy: Mean(close, 150)
  turnover_amount: (open + close) / 2 * volume
  turnover43: Mean(turnover_amount, 43)
  liquidity_rank: CSPctRank(turnover43)
  trend_gap: close / zxdkx - 1
  score_b1: (15 - j) * 0.02 + trend_gap + liquidity_rank * 0.05

signals:
  b1_low_j: j < 15
  zx_bull: (close > zxdkx) and (zxdq > zxdkx)
  weekly_bull_proxy: (wma50_proxy > wma100_proxy) and (wma100_proxy > wma150_proxy)
  buy_signal: b1_low_j and zx_bull and weekly_bull_proxy and (liquidity_rank > 0.20)
  sell_signal: (j > 85) or (close < ma28)

selector:
  mode: precomputed
  where: buy_signal
  score: score_b1
  sort: score_desc
  topk: 50
  lag: 1
  wrap_first_signal: false
  reason: stocktradebyz_b1_approx_buy

rebalance:
  type: equal_weight
  max_positions: 10
  cash_use_ratio: 0.99
  buy_only_new_positions: true

execution:
  deal_price: close
  sell_rules:
    - name: signal_sell
      when: sell_signal
      action: sell_all
    - name: take_profit
      when: pnl_pct > 0.22
      action: sell_all
    - name: stop_loss
      when: pnl_pct < -0.09
      action: sell_all
    - name: time_stop
      when: holding_days > 25
      action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true

cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0001
  stamp_tax_on_buy: true
  transfer_fee_rate: 0.0
  slippage: 0.0

engine:
  init_cash: 1000000
  validate_trading_rules: false
  deal_price: close
  max_workers: 1
  error_policy: fail_fast
  legacy_cost_price: true
  auto_adjust_buy_quantity: false

