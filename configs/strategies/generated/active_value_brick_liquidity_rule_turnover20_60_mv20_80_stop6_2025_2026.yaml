name: active_value_brick_liquidity_rule_turnover20_60_mv20_80_stop6_2025_2026
version: 2026-07-16
description: >
  Active-value brick reversal candidate using the audited liquidity filter:
  turnover_rate_rank_pct in [0.20, 0.60] and free_float_mv_rank_pct in
  [0.20, 0.80]. The selector ranks by rule_score and uses the same 6% stop
  loss / 10-session maximum holding exit as the audited active brick replay.
data:
  provider_uri: data/qlib_data_fixed
  universe: external_score
  start: '2025-01-02'
  end: '2026-07-15'
  look_back_days: 720
fields:
  open: $open
  high: $high
  low: $low
  close: $close
  volume: $volume
  vwap: $vwap
selector:
  mode: external_score
  path: data/derived/active_value_brick_ml/liquidity_rule_turnover20_60_mv20_80_scores_2025_2026.parquet
  date_col: date
  instrument_col: instrument
  score_col: rule_score
  lag: 1
  sort: score_desc
  topk: 3
  candidate_limit: 20
  reason: active_value_brick_liquidity_rule
rebalance:
  type: equal_weight
  max_positions: 3
  buy_only_new_positions: true
execution:
  deal_price: open
  sell_decision_price: close
  cash_use_ratio: 0.98
  sell_rules:
  - name: stop_loss_6pct
    when: pnl_pct < -0.06
    action: sell_all
  - name: max_hold_10d
    when: holding_days >= 10
    action: sell_all
  buy:
    sizing: cash_equal
    lot_size: 100
    skip_if_holding: true
    skip_limit_up: true
    reuse_sell_cash: true
cost:
  commission_rate: 0.0005
  min_commission: 5.0
  stamp_tax_rate: 0.0005
  stamp_tax_on_buy: false
  transfer_fee_rate: 0.0
  slippage: 0.0
  buy_slippage: 0.003
  sell_slippage: 0.001
engine:
  init_cash: 1000000
  validate_trading_rules: true
  deal_price: open
  max_workers: 1
  legacy_cost_price: false
  auto_adjust_buy_quantity: true
  precompute_signals: false
